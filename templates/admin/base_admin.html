<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin{% endblock %} – Gazi Imam Champions</title>
  <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
  {% block head %}{% endblock %}
</head>
<body>

<div class="admin-wrap">
  <aside class="admin-sidebar">
    <h2>Admin panel</h2>
    <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">Dashboard</a>
    <a href="/admin/tournament/new" class="{% if request.url.path == '/admin/tournament/new' %}active{% endif %}">New tournament</a>
    <a href="/admin/settings" class="{% if request.url.path == '/admin/settings' %}active{% endif %}">Site settings</a>
    <a href="/" target="_blank">View site</a>
    <a href="/admin/logout">Log out</a>
  </aside>

  <main class="admin-content">
    {% block content %}{% endblock %}
  </main>
</div>

<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
