<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Admin{% endblock %} – Pigeon flying Tournament</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>
<div class="admin-wrap">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <h2>🏆 Admin Panel</h2>
    <a href="/admin" class="{% if request.url.path == '/admin' %}active{% endif %}">Dashboard</a>
    <a href="/admin/tournament/new">+ New Tournament</a>
    <a href="/admin/settings" class="{% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
    <a href="/" target="_blank" style="margin-top:20px;opacity:0.7;">View Site ↗</a>
    <a href="/admin/logout" style="margin-top:auto;color:rgba(255,100,100,0.9);">Logout</a>
  </aside>

  <!-- CONTENT -->
  <main class="admin-content">
    {% block content %}{% endblock %}
  </main>

</div>
<script src="/static/js/main.js"></script>
</body>
</html>
